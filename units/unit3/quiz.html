<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP CSP p5.js Review Showdown</title>
<style>
  :root {
    --stage-1: #3b0f8c;
    --stage-2: #6a1fd1;
    --panel: #ffffff;
    --panel-soft: #f3efff;
    --ink: #1c1433;
    --ink-soft: #5b5378;
    --code-bg: #1d1730;
    --code-ink: #f4f1ff;
    --code-accent: #ffd447;
    --t-red: #e21b3c;
    --t-blue: #1368ce;
    --t-yellow: #c98f00;
    --t-green: #26890c;
    --ok: #1f9d55;
    --bad: #d7263d;
    --gold: #ffd447;
    --radius-lg: 22px;
    --radius-sm: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --stage-1: #150634;
      --stage-2: #2c0b66;
      --panel: #221a3b;
      --panel-soft: #2d2450;
      --ink: #f2eeff;
      --ink-soft: #b9b0d9;
      --code-bg: #120d22;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { font-size: clamp(17px, 0.9vw + 11px, 24px); }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,0.08) 0 120px, transparent 121px),
      radial-gradient(circle at 88% 82%, rgba(255,255,255,0.06) 0 180px, transparent 181px),
      linear-gradient(160deg, var(--stage-1), var(--stage-2));
    background-attachment: fixed;
  }
  code, pre, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, .sec-card:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
  .screen { display: none; max-width: 1200px; margin: 0 auto; padding: 1.2rem 1.2rem 3rem; }
  .screen.active { display: block; }

  /* ---------- HOME ---------- */
  .brand { text-align: center; color: #fff; padding: 1.2rem 0 1.4rem; }
  .brand h1 {
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    margin: 0;
    font-weight: 900;
    letter-spacing: -0.02em;
    text-shadow: 0 5px 0 rgba(0,0,0,0.25);
  }
  .brand p { margin: 0.4rem 0 0; font-size: 1.1rem; opacity: 0.9; }
  .home-panel {
    background: var(--panel);
    border-radius: var(--radius-lg);
    padding: 1.4rem;
    box-shadow: 0 10px 0 rgba(0,0,0,0.25);
  }
  .home-panel h2 { margin: 0 0 0.8rem; font-size: 1.3rem; }
  .sec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0.9rem; }
  .sec-card {
    display: flex; align-items: center; gap: 0.9rem;
    border: 4px solid transparent;
    background: var(--panel-soft);
    color: var(--ink);
    border-radius: 16px;
    padding: 0.9rem 1rem;
    text-align: left;
    font-size: 1rem;
    transition: transform 0.12s;
  }
  .sec-card:active { transform: scale(0.98); }
  .sec-card .badge {
    flex: none; width: 3.4rem; height: 3.4rem; border-radius: 14px;
    display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 1rem;
  }
  .sec-card .meta strong { display: block; font-size: 1.05rem; }
  .sec-card .meta span { color: var(--ink-soft); font-size: 0.9rem; }
  .sec-card .check {
    margin-left: auto; width: 1.7rem; height: 1.7rem; border-radius: 50%;
    border: 3px solid var(--ink-soft); display: grid; place-items: center; font-weight: 900; color: #fff;
  }
  .sec-card.on { border-color: var(--sec-color); }
  .sec-card.on .check { background: var(--sec-color); border-color: var(--sec-color); }
  .controls { display: flex; flex-wrap: wrap; gap: 1.2rem; align-items: center; margin-top: 1.3rem; }
  .control-group { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .control-group > span { font-weight: 800; }
  .seg { display: inline-flex; background: var(--panel-soft); border-radius: 999px; padding: 4px; }
  .seg button {
    border: 0; background: transparent; color: var(--ink); padding: 0.45rem 0.95rem;
    border-radius: 999px; font-size: 0.95rem; font-weight: 800;
  }
  .seg button.on { background: var(--stage-2); color: #fff; }
  .link-btn { border: 0; background: none; color: var(--stage-2); font-weight: 800; font-size: 0.95rem; text-decoration: underline; }
  @media (prefers-color-scheme: dark) { .link-btn { color: var(--gold); } }
  .start-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1.4rem; flex-wrap: wrap; }
  .count-note { color: var(--ink-soft); font-size: 1rem; }
  .big-btn {
    border: 0; border-radius: 14px; padding: 0.9rem 2.2rem;
    font-size: 1.3rem; font-weight: 900; color: #fff; background: var(--ink);
    box-shadow: 0 6px 0 rgba(0,0,0,0.35);
    transition: transform 0.08s, box-shadow 0.08s;
  }
  @media (prefers-color-scheme: dark) { .big-btn { background: var(--gold); color: #1c1433; } }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
  .big-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .big-btn.alt { background: var(--stage-2); color: #fff; }

  /* ---------- GAME ---------- */
  .hud { display: flex; align-items: center; gap: 0.8rem; color: #fff; flex-wrap: wrap; }
  .chip {
    background: rgba(255,255,255,0.16); border-radius: 999px; padding: 0.4rem 0.95rem;
    font-weight: 800; font-size: 0.95rem; white-space: nowrap;
  }
  .chip.sec { background: var(--sec-color, #fff); }
  .hud .spacer { flex: 1; }
  .score-box {
    background: #fff; color: #1c1433; border-radius: 12px; padding: 0.35rem 1rem;
    font-weight: 900; font-size: 1.25rem; min-width: 6.5rem; text-align: center;
  }
  .score-box small { display: block; font-size: 0.65rem; font-weight: 800; color: #6b6488; margin-bottom: -2px; }
  .quit { border: 0; background: rgba(0,0,0,0.25); color: #fff; border-radius: 10px; padding: 0.45rem 0.9rem; font-weight: 800; font-size: 0.9rem; }
  .bar { height: 14px; background: rgba(255,255,255,0.18); border-radius: 999px; overflow: hidden; margin: 0.8rem 0 0.4rem; }
  .bar > div { height: 100%; background: var(--gold); width: 0; transition: width 0.35s ease; }
  .timer-bar { height: 10px; background: rgba(0,0,0,0.25); border-radius: 999px; overflow: hidden; margin-bottom: 0.8rem; }
  .timer-bar > div { height: 100%; background: #fff; width: 100%; }
  .timer-bar.low > div { background: #ff6b6b; }
  .q-card {
    background: var(--panel); border-radius: var(--radius-lg); padding: 1.3rem 1.5rem;
    box-shadow: 0 8px 0 rgba(0,0,0,0.25); margin-bottom: 1rem;
  }
  .q-text { font-size: 1.45rem; font-weight: 800; line-height: 1.35; margin: 0; }
  .q-text code, .exp code, .review code {
    background: var(--panel-soft); padding: 0.05em 0.35em; border-radius: 6px; font-size: 0.92em;
  }
  pre.code {
    background: var(--code-bg); color: var(--code-ink);
    border-radius: 14px; padding: 1rem 1.2rem; margin: 1rem 0 0;
    font-size: 1.15rem; line-height: 1.5; overflow-x: auto; white-space: pre;
    border-left: 8px solid var(--sec-color, var(--gold));
  }
  pre.code .cm { color: #9d93c4; font-style: italic; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  @media (max-width: 760px) { .answers { grid-template-columns: 1fr; } }
  .ans {
    position: relative; display: flex; align-items: center; gap: 0.9rem;
    border: 0; border-radius: 16px; padding: 1rem 1.1rem; min-height: 5rem;
    color: #fff; font-size: 1.2rem; font-weight: 800; text-align: left; line-height: 1.3;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3);
    transition: transform 0.08s, opacity 0.25s, filter 0.25s;
  }
  .ans:not(:disabled):hover { filter: brightness(1.08); }
  .ans:not(:disabled):active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
  .ans .shape { flex: none; font-size: 1.7rem; width: 2rem; text-align: center; text-shadow: 0 2px 0 rgba(0,0,0,0.25); }
  .ans .label { flex: 1; min-width: 0; }
  .ans .label pre { margin: 0; font-size: 1rem; white-space: pre-wrap; font-weight: 700; line-height: 1.4; }
  .ans .key { position: absolute; top: 6px; right: 10px; font-size: 0.7rem; opacity: 0.75; }
  .ans.c0 { background: var(--t-red); }
  .ans.c1 { background: var(--t-blue); }
  .ans.c2 { background: var(--t-yellow); }
  .ans.c3 { background: var(--t-green); }
  .ans:disabled { cursor: default; }
  .ans.dim { opacity: 0.3; filter: grayscale(0.6); }
  .ans .mark {
    flex: none; width: 2.2rem; height: 2.2rem; border-radius: 50%; background: #fff;
    display: none; place-items: center; font-size: 1.3rem; font-weight: 900;
  }
  .ans.right .mark { display: grid; color: var(--ok); }
  .ans.wrong .mark { display: grid; color: var(--bad); }
  .ans.right { outline: 5px solid #fff; outline-offset: -5px; }

  .feedback {
    display: none; margin-top: 1rem; background: var(--panel); border-radius: var(--radius-lg);
    overflow: hidden; box-shadow: 0 8px 0 rgba(0,0,0,0.25);
  }
  .feedback.show { display: block; animation: pop 0.25s ease-out; }
  @keyframes pop { from { transform: scale(0.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .fb-head { display: flex; align-items: center; gap: 0.8rem; padding: 0.9rem 1.4rem; color: #fff; font-weight: 900; font-size: 1.5rem; }
  .fb-head.ok { background: var(--ok); }
  .fb-head.bad { background: var(--bad); }
  .fb-head .pts { margin-left: auto; font-size: 1.15rem; background: rgba(0,0,0,0.2); padding: 0.25rem 0.8rem; border-radius: 999px; }
  .fb-body { padding: 1rem 1.4rem 1.3rem; }
  .exp { font-size: 1.15rem; line-height: 1.5; margin: 0 0 1rem; }
  .correct-line { font-weight: 800; margin: 0 0 0.6rem; font-size: 1.1rem; }
  .fb-actions { display: flex; justify-content: flex-end; align-items: center; gap: 1rem; }
  .hint { color: var(--ink-soft); font-size: 0.85rem; }

  /* ---------- SUMMARY ---------- */
  .podium { text-align: center; color: #fff; padding: 1rem 0 1.4rem; }
  .podium .trophy { font-size: 4rem; line-height: 1; }
  .podium h1 { font-size: clamp(2rem, 4.5vw, 3.2rem); margin: 0.3rem 0 0; font-weight: 900; }
  .podium .final { font-size: clamp(2.8rem, 7vw, 4.8rem); font-weight: 900; color: var(--gold); text-shadow: 0 5px 0 rgba(0,0,0,0.3); line-height: 1.1; }
  .podium p { margin: 0.2rem 0; font-size: 1.15rem; opacity: 0.95; }
  .sum-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 1rem; }
  @media (max-width: 860px) { .sum-grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border-radius: var(--radius-lg); padding: 1.3rem 1.4rem; box-shadow: 0 8px 0 rgba(0,0,0,0.25); }
  .panel h2 { margin: 0 0 0.9rem; font-size: 1.3rem; }
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem; }
  .stat { background: var(--panel-soft); border-radius: 14px; padding: 0.8rem; text-align: center; }
  .stat b { display: block; font-size: 1.9rem; }
  .stat span { color: var(--ink-soft); font-size: 0.9rem; }
  .sec-row { margin-bottom: 0.85rem; }
  .sec-row .top { display: flex; justify-content: space-between; font-weight: 800; font-size: 1rem; margin-bottom: 0.25rem; }
  .sec-row .track { height: 16px; background: var(--panel-soft); border-radius: 999px; overflow: hidden; }
  .sec-row .fill { height: 100%; border-radius: 999px; }
  .review details { border-radius: 14px; background: var(--panel-soft); margin-bottom: 0.7rem; padding: 0.7rem 1rem; }
  .review summary { cursor: pointer; font-weight: 800; font-size: 1.05rem; line-height: 1.35; }
  .review .r-body { padding-top: 0.6rem; font-size: 1.05rem; line-height: 1.5; }
  .review .r-body pre.code { font-size: 1rem; }
  .review .yours { color: var(--bad); font-weight: 800; }
  .review .theirs { color: var(--ok); font-weight: 800; }
  .sum-actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin-top: 1.4rem; }
  .empty { color: var(--ink-soft); font-size: 1.05rem; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<section id="home" class="screen active" aria-label="Choose sections">
  <div class="brand">
    <h1>p5.js Review Showdown</h1>
    <p>AP CSP &middot; 6 topics &middot; pick your sections and play</p>
  </div>
  <div class="home-panel">
    <h2>Choose sections <button class="link-btn" id="toggleAll" type="button">Select none</button></h2>
    <div class="sec-grid" id="secGrid"></div>
    <div class="controls">
      <div class="control-group">
        <span>Timer</span>
        <div class="seg" id="timerSeg">
          <button type="button" data-t="0" class="on">Off</button>
          <button type="button" data-t="30">30 s</button>
          <button type="button" data-t="60">60 s</button>
        </div>
      </div>
      <div class="control-group">
        <span>Order</span>
        <div class="seg" id="orderSeg">
          <button type="button" data-o="shuffle" class="on">Shuffled</button>
          <button type="button" data-o="section">By section</button>
        </div>
      </div>
    </div>
    <div class="start-row">
      <div class="count-note" id="countNote"></div>
      <button class="big-btn" id="startBtn" type="button">Start</button>
    </div>
  </div>
</section>

<!-- ================= GAME ================= -->
<section id="game" class="screen" aria-label="Quiz">
  <div class="hud">
    <span class="chip sec" id="secChip"></span>
    <span class="chip" id="qCount"></span>
    <span class="chip" id="streakChip">🔥 0</span>
    <span class="spacer"></span>
    <div class="score-box"><small>SCORE</small><span id="scoreVal">0</span></div>
    <button class="quit" id="quitBtn" type="button">Quit</button>
  </div>
  <div class="bar" aria-hidden="true"><div id="progressFill"></div></div>
  <div class="timer-bar" id="timerBar" hidden><div id="timerFill"></div></div>

  <div class="q-card">
    <p class="q-text" id="qText"></p>
    <div id="qCode"></div>
  </div>
  <div class="answers" id="answers"></div>

  <div class="feedback" id="feedback" aria-live="polite">
    <div class="fb-head" id="fbHead"></div>
    <div class="fb-body">
      <p class="correct-line" id="correctLine"></p>
      <p class="exp" id="expText"></p>
      <div class="fb-actions">
        <span class="hint">Press Enter</span>
        <button class="big-btn alt" id="nextBtn" type="button">Next</button>
      </div>
    </div>
  </div>
</section>

<!-- ================= SUMMARY ================= -->
<section id="summary" class="screen" aria-label="Results">
  <div class="podium">
    <div class="trophy" id="trophy">🏆</div>
    <h1 id="rankMsg"></h1>
    <div class="final" id="finalScore">0</div>
    <p id="finalLine"></p>
  </div>
  <div class="sum-grid">
    <div class="panel">
      <h2>How you did</h2>
      <div class="stat-row">
        <div class="stat"><b id="stCorrect">0</b><span>correct</span></div>
        <div class="stat"><b id="stAcc">0%</b><span>accuracy</span></div>
        <div class="stat"><b id="stStreak">0</b><span>best streak</span></div>
      </div>
      <h2 style="margin-top:1.3rem">By topic</h2>
      <div id="secBreakdown"></div>
    </div>
    <div class="panel review">
      <h2>Review missed questions</h2>
      <div id="missedList"></div>
    </div>
  </div>
  <div class="sum-actions">
    <button class="big-btn alt" id="retryBtn" type="button">Retry missed questions</button>
    <button class="big-btn" id="homeBtn" type="button">Back to sections</button>
  </div>
</section>

<script>
/* =========================================================
   SECTIONS
   ========================================================= */
const SECTIONS = [
  { id: 1, code: "1.4",  name: "Identifying & Correcting Errors", color: "#e21b3c" },
  { id: 2, code: "3.12", name: "Calling Procedures",               color: "#1368ce" },
  { id: 3, code: "3.9",  name: "Developing Algorithms",            color: "#c98f00" },
  { id: 4, code: "3.15", name: "Random Values",                    color: "#26890c" },
  { id: 5, code: "3.6",  name: "Conditionals",                     color: "#8a3ffc" },
  { id: 6, code: "3.8",  name: "Iteration",                        color: "#0a8f8f" }
];

/* =========================================================
   QUESTION BANK
   s = section id, q = question, code = optional code,
   opts = 4 choices, a = index of correct choice,
   exp = explanation, codeOpts = choices shown as code,
   fixed = keep choices in the written order
   ========================================================= */
const BANK = [
/* ---------------- 1.4 IDENTIFYING & CORRECTING ERRORS ---------------- */
{ s:1,
  q:"The programmer expects a circle in the middle of a gray canvas, but the canvas is plain gray. What is the error?",
  code:`function setup() {
  createCanvas(400, 400);
}

function draw() {
  circle(200, 200, 50);
  background(220);
}`,
  opts:["background(220) runs after circle(), so it paints over the circle every frame — move it to the first line of draw()",
        "The circle's diameter is too small to see",
        "circle() can only be called inside setup()",
        "createCanvas() must be called inside draw()"],
  a:0,
  exp:"p5.js draws in order, like layers of paint. `background()` covers everything already drawn. Calling it FIRST in `draw()` clears the old frame, and then the circle is drawn on top." },

{ s:1,
  q:"This sketch shows only a tiny black canvas and no rectangle. What is the best fix?",
  code:`function setup() {
}

function draw() {
  background(0);
  rect(300, 300, 50, 50);
}`,
  opts:["Add createCanvas(400, 400); inside setup()",
        "Change background(0) to background(255)",
        "Move rect() into setup()",
        "Change rect() to square()"],
  a:0,
  exp:"Without `createCanvas()`, p5.js makes a default 100 × 100 canvas. A rectangle at (300, 300) is far off the edge, so it is never visible." },

{ s:1,
  q:"Which line causes an error when this sketch runs?",
  code:`function setup() {
  createCanvas(400, 400);   // Line 2
  background(220);          // Line 3
  Circle(200, 200, 80);     // Line 4
  fill(255, 0, 0);          // Line 5
}`,
  opts:["Line 2","Line 3","Line 4","Line 5"], a:2, fixed:true,
  exp:"JavaScript is case-sensitive. The built-in function is `circle`, not `Circle`, so the console reports that `Circle` is not defined." },

{ s:1,
  q:"The programmer wants BOTH circles to be red, but only the right circle is red. Which change fixes the program?",
  code:`function setup() {
  createCanvas(400, 400);
  background(220);
  circle(100, 200, 80);
  fill(255, 0, 0);
  circle(300, 200, 80);
}`,
  opts:["Move fill(255, 0, 0) above the first circle() call",
        "Change fill(255, 0, 0) to fill(0, 255, 0)",
        "Call fill(255, 0, 0) again after the second circle",
        "Change background(220) to background(255, 0, 0)"],
  a:0,
  exp:"`fill()` only affects shapes drawn AFTER it. The first circle is drawn with the default white fill because the red fill hasn't been set yet." },

{ s:1,
  q:"The programmer wants a circle near the BOTTOM-RIGHT corner of a 400 × 400 canvas, but this line draws it near the TOP-RIGHT. Which replacement fixes it?",
  code:`circle(350, 50, 60);`,
  opts:["circle(350, 350, 60);","circle(50, 350, 60);","circle(50, 50, 60);","circle(-350, 50, 60);"],
  a:0, codeOpts:true,
  exp:"In p5.js, (0, 0) is the TOP-LEFT corner and y increases going DOWN. A y-value of 350 is near the bottom; x = 350 is near the right." },

{ s:1,
  q:"When this sketch runs, the console shows: ReferenceError: size is not defined. What is the best fix?",
  code:`function setup() {
  createCanvas(400, 400);
  let size = 50;
}

function draw() {
  background(220);
  circle(200, 200, size);
}`,
  opts:["Declare let size = 50; at the top of the sketch, outside both functions",
        "Change let to const inside setup()",
        "Move createCanvas() into draw()",
        "Rename size to Size inside draw()"],
  a:0,
  exp:"A variable declared with `let` inside `setup()` is LOCAL — it only exists inside `setup()`. Declaring it at the top of the sketch makes it GLOBAL, so `draw()` can use it." },

{ s:1,
  q:"The circle is supposed to slide to the right, but it never moves. Why?",
  code:`function setup() {
  createCanvas(400, 400);
}

function draw() {
  let x = 0;
  background(220);
  circle(x, 200, 30);
  x = x + 2;
}`,
  opts:["x is declared inside draw(), so it is reset to 0 at the start of every frame",
        "x = x + 2 must come before let x = 0",
        "background(220) erases the movement",
        "circle() cannot use a variable for its x-position"],
  a:0,
  exp:"`draw()` runs about 60 times per second, and every time it runs `let x = 0` starts over. Move `let x = 0;` above `draw()` so the value is kept between frames." },

{ s:1,
  q:"The programmer wants to display the current VALUE of score, but the canvas always shows the word score. What is the error?",
  code:`let score = 0;

function setup() {
  createCanvas(400, 200);
}

function draw() {
  background(255);
  score = score + 1;
  text("score", 50, 100);
}`,
  opts:["\"score\" is in quotation marks, so it is text, not the variable — use text(score, 50, 100)",
        "score must be declared inside draw()",
        "text() cannot display numbers",
        "score = score + 1 should be written score + 1"],
  a:0,
  exp:"Anything in quotation marks is a string literal — the exact characters s-c-o-r-e. Without quotes, `score` refers to the variable and shows its value." },

{ s:1,

/* =========================================================
   STATE
   ========================================================= */
const state = {
  selected: new Set(SECTIONS.map(s => s.id)),
  timer: 0,
  order: "shuffle",
  queue: [],
  idx: 0,
  score: 0,
  streak: 0,
  bestStreak: 0,
  results: [],
  locked: false,
  shown: null,
  tStart: 0,
  tick: null
};

const $ = id => document.getElementById(id);
const SHAPES = ["▲", "◆", "●", "■"];

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inlineCode(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
}
function codeBlock(src) {
  // escape, then dim comments
  const lines = esc(src).split("\n").map(line => {
    const i = line.indexOf("//");
    return i === -1 ? line : line.slice(0, i) + '<span class="cm">' + line.slice(i) + "</span>";
  });
  return '<pre class="code">' + lines.join("\n") + "</pre>";
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function secOf(id) { return SECTIONS.find(s => s.id === id); }
function show(id) {
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0, 0);
}

/* =========================================================
   HOME
   ========================================================= */
function buildHome() {
  const grid = $("secGrid");
  grid.innerHTML = "";
  SECTIONS.forEach(sec => {
    const n = BANK.filter(q => q.s === sec.id).length;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "sec-card" + (state.selected.has(sec.id) ? " on" : "");
    btn.style.setProperty("--sec-color", sec.color);
    btn.setAttribute("aria-pressed", state.selected.has(sec.id));
    btn.innerHTML =
      '<span class="badge" style="background:' + sec.color + '">' + sec.code + "</span>" +
      '<span class="meta"><strong>' + sec.name + "</strong><span>" + n + " questions</span></span>" +
      '<span class="check">' + (state.selected.has(sec.id) ? "✓" : "") + "</span>";
    btn.onclick = () => {
      if (state.selected.has(sec.id)) state.selected.delete(sec.id);
      else state.selected.add(sec.id);
      buildHome();
    };
    grid.appendChild(btn);
  });
  const total = BANK.filter(q => state.selected.has(q.s)).length;
  $("countNote").textContent = total
    ? total + " questions in " + state.selected.size + " section" + (state.selected.size === 1 ? "" : "s")
    : "Choose at least one section to start.";
  $("startBtn").disabled = total === 0;
  $("toggleAll").textContent = state.selected.size === SECTIONS.length ? "Select none" : "Select all";
}

$("toggleAll").onclick = () => {
  if (state.selected.size === SECTIONS.length) state.selected.clear();
  else SECTIONS.forEach(s => state.selected.add(s.id));
  buildHome();
};
document.querySelectorAll("#timerSeg button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#timerSeg button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    state.timer = Number(b.dataset.t);
  };
});
document.querySelectorAll("#orderSeg button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#orderSeg button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    state.order = b.dataset.o;
  };
});
$("startBtn").onclick = () => {
  const qs = BANK.filter(q => state.selected.has(q.s));
  startGame(qs);
};

/* =========================================================
   GAME
   ========================================================= */
function startGame(questions) {
  state.queue = state.order === "shuffle" ? shuffle(questions) : questions.slice().sort((a, b) => a.s - b.s);
  state.idx = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.results = [];
  $("scoreVal").textContent = "0";
  show("game");
  renderQuestion();
}

function renderQuestion() {
  const q = state.queue[state.idx];
  const sec = secOf(q.s);
  state.locked = false;
  document.documentElement.style.setProperty("--sec-color", sec.color);

  $("secChip").textContent = sec.code + " " + sec.name;
  $("secChip").style.background = sec.color;
  $("qCount").textContent = (state.idx + 1) + " / " + state.queue.length;
  $("streakChip").textContent = "🔥 " + state.streak;
  $("progressFill").style.width = (state.idx / state.queue.length * 100) + "%";

  $("qText").innerHTML = inlineCode(q.q);
  $("qCode").innerHTML = q.code ? codeBlock(q.code) : "";

  // choose display order
  const order = q.fixed ? [0, 1, 2, 3] : shuffle([0, 1, 2, 3]);
  state.shown = order;

  const box = $("answers");
  box.innerHTML = "";
  order.forEach((orig, pos) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ans c" + pos;
    const label = q.codeOpts
      ? '<pre class="mono">' + esc(q.opts[orig]) + "</pre>"
      : inlineCode(q.opts[orig]);
    b.innerHTML =
      '<span class="shape" aria-hidden="true">' + SHAPES[pos] + "</span>" +
      '<span class="label">' + label + "</span>" +
      '<span class="mark"></span>' +
      '<span class="key" aria-hidden="true">' + (pos + 1) + "</span>";
    b.onclick = () => choose(pos);
    box.appendChild(b);
  });

  $("feedback").classList.remove("show");

  // timer
  clearInterval(state.tick);
  if (state.timer > 0) {
    $("timerBar").hidden = false;
    $("timerBar").classList.remove("low");
    $("timerFill").style.width = "100%";
    state.tStart = Date.now();
    state.tick = setInterval(() => {
      const left = state.timer - (Date.now() - state.tStart) / 1000;
      const pct = Math.max(0, left / state.timer * 100);
      $("timerFill").style.width = pct + "%";
      $("timerBar").classList.toggle("low", left <= 5);
      if (left <= 0) { clearInterval(state.tick); choose(-1); }
    }, 100);
  } else {
    $("timerBar").hidden = true;
  }
}

function choose(pos) {
  if (state.locked) return;
  state.locked = true;
  clearInterval(state.tick);

  const q = state.queue[state.idx];
  const correctPos = state.shown.indexOf(q.a);
  const isRight = pos === correctPos;

  let pts = 0;
  if (isRight) {
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    if (state.timer > 0) {
      const left = Math.max(0, state.timer - (Date.now() - state.tStart) / 1000);
      pts = Math.round(500 + 500 * (left / state.timer));
    } else {
      pts = 1000;
    }
    pts += Math.min(state.streak - 1, 5) * 100;
    state.score += pts;
  } else {
    state.streak = 0;
  }

  state.results.push({ q, picked: pos === -1 ? -1 : state.shown[pos], right: isRight });

  // mark tiles
  [...$("answers").children].forEach((btn, i) => {
    btn.disabled = true;
    const mark = btn.querySelector(".mark");
    if (i === correctPos) { btn.classList.add("right"); mark.textContent = "✓"; }
    else if (i === pos) { btn.classList.add("wrong"); mark.textContent = "✗"; }
    else btn.classList.add("dim");
  });

  $("scoreVal").textContent = state.score.toLocaleString();
  $("streakChip").textContent = "🔥 " + state.streak;

  const head = $("fbHead");
  head.className = "fb-head " + (isRight ? "ok" : "bad");
  head.innerHTML = isRight
    ? '<span>✓ Correct!</span><span class="pts">+' + pts.toLocaleString() + "</span>"
    : '<span>' + (pos === -1 ? "⏰ Time's up!" : "✗ Not quite") + '</span><span class="pts">+0</span>';
  $("correctLine").innerHTML = isRight ? "" : "Correct answer: " +
    (q.codeOpts ? "<code>" + esc(q.opts[q.a]).replace(/\n/g, " ") + "</code>" : inlineCode(q.opts[q.a]));
  $("correctLine").style.display = isRight ? "none" : "block";
  $("expText").innerHTML = inlineCode(q.exp);
  $("nextBtn").textContent = state.idx === state.queue.length - 1 ? "See results" : "Next";
  $("feedback").classList.add("show");
  $("progressFill").style.width = ((state.idx + 1) / state.queue.length * 100) + "%";
  setTimeout(() => {
    $("feedback").scrollIntoView({ behavior: "smooth", block: "nearest" });
    $("nextBtn").focus({ preventScroll: true });
  }, 60);
}

function next() {
  if (!state.locked) return;
  if (state.idx < state.queue.length - 1) {
    state.idx++;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    showSummary();
  }
}
$("nextBtn").onclick = next;
$("quitBtn").onclick = () => {
  clearInterval(state.tick);
  if (state.results.length === 0 || confirm("Quit this round and see results so far?")) {
    if (state.results.length) showSummary(); else { show("home"); buildHome(); }
  }
};

document.addEventListener("keydown", e => {
  if (!$("game").classList.contains("active")) return;
  if (!state.locked && ["1", "2", "3", "4"].includes(e.key)) {
    choose(Number(e.key) - 1);
  } else if (state.locked && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    next();
  }
});

/* =========================================================
   SUMMARY
   ========================================================= */
function showSummary() {
  clearInterval(state.tick);
  const total = state.results.length;
  const correct = state.results.filter(r => r.right).length;
  const acc = total ? Math.round(correct / total * 100) : 0;

  let msg = "Keep practicing!", trophy = "💪";
  if (acc >= 90) { msg = "AP-ready legend!"; trophy = "🏆"; }
  else if (acc >= 75) { msg = "Strong work!"; trophy = "🥈"; }
  else if (acc >= 60) { msg = "Getting there!"; trophy = "🥉"; }

  $("trophy").textContent = trophy;
  $("rankMsg").textContent = msg;
  $("finalScore").textContent = state.score.toLocaleString();
  $("finalLine").textContent = correct + " of " + total + " correct";
  $("stCorrect").textContent = correct + "/" + total;
  $("stAcc").textContent = acc + "%";
  $("stStreak").textContent = state.bestStreak;

  // by section
  const bd = $("secBreakdown");
  bd.innerHTML = "";
  SECTIONS.forEach(sec => {
    const rs = state.results.filter(r => r.q.s === sec.id);
    if (!rs.length) return;
    const c = rs.filter(r => r.right).length;
    const pct = Math.round(c / rs.length * 100);
    bd.insertAdjacentHTML("beforeend",
      '<div class="sec-row"><div class="top"><span>' + sec.code + " " + sec.name +
      "</span><span>" + c + "/" + rs.length + " (" + pct + '%)</span></div>' +
      '<div class="track"><div class="fill" style="width:' + pct + "%;background:" + sec.color + '"></div></div></div>');
  });

  // missed
  const missed = state.results.filter(r => !r.right);
  const ml = $("missedList");
  ml.innerHTML = "";
  if (!missed.length) {
    ml.innerHTML = '<p class="empty">No missed questions. Perfect round!</p>';
  } else {
    missed.forEach((r, i) => {
      const q = r.q;
      const fmt = idx => idx === -1 ? "No answer (time ran out)"
        : q.codeOpts ? "<code>" + esc(q.opts[idx]).replace(/\n/g, " ") + "</code>" : inlineCode(q.opts[idx]);
      ml.insertAdjacentHTML("beforeend",
        "<details><summary>" + secOf(q.s).code + " · " + inlineCode(q.q) + "</summary>" +
        '<div class="r-body">' + (q.code ? codeBlock(q.code) : "") +
        '<p><span class="yours">Your answer:</span> ' + fmt(r.picked) + "</p>" +
        '<p><span class="theirs">Correct:</span> ' + fmt(q.a) + "</p>" +
        "<p>" + inlineCode(q.exp) + "</p></div></details>");
    });
  }
  $("retryBtn").style.display = missed.length ? "" : "none";
  show("summary");
}

$("retryBtn").onclick = () => {
  const missedQs = state.results.filter(r => !r.right).map(r => r.q);
  if (missedQs.length) startGame(missedQs);
};
$("homeBtn").onclick = () => { show("home"); buildHome(); };

buildHome();
</script>
